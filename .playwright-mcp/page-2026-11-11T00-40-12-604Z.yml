                    - generic [ref=f9e373]: // ...
                  - paragraph [ref=f9e374]:
                    - text: The convention is to name state variables like
                    - code [ref=f9e375]: "[something, setSomething]"
                    - text: using
                    - link "array destructuring." [ref=f9e376] [cursor=pointer]:
