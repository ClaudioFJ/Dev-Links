                  - paragraph [ref=f9e389]:
                    - code [ref=f9e390]: useState
                    - text: "returns an array with exactly two values:"
                  - list [ref=f9e391]:
                    - listitem [ref=f9e392]:
                      - text: The current state. During the first render, it will match the
                      - code [ref=f9e393]: initialState
                      - text: you have passed.
                    - listitem [ref=f9e394]:
                      - text: The
                      - link [ref=f9e395] [cursor=pointer]:
                        - /url: "#setstate"
                        - code [ref=f9e396]: set
                        - text: function
                      - text: that lets you update the state to a different value and trigger a re-render.
                  - heading "Caveats Link for Caveats" [level=4] [ref=f9e397]:
                    - text: Caveats
                    - link "Link for Caveats":
                      - /url: "#caveats"
                  - list [ref=f9e398]:
                    - listitem [ref=f9e399]:
                      - code [ref=f9e400]: useState
                      - text: is a Hook, so you can only call it
                      - strong [ref=f9e401]: at the top level of your component
                      - text: or your own Hooks. You can’t call it inside loops or conditions. If you need that, extract a new component and move the state into it.
                    - listitem [ref=f9e402]:
                      - text: In Strict Mode, React will
                      - strong [ref=f9e403]: call your initializer function twice
                      - text: in order to
                      - link "help you find accidental impurities." [ref=f9e404] [cursor=pointer]:
                        - /url: "#my-initializer-or-updater-function-runs-twice"
                      - text: This is development-only behavior and does not affect production. If your initializer function is pure (as it should be), this should not affect the behavior. The result from one of the calls will be ignored.
                  - separator [ref=f9e405]
                  - heading [level=3] [ref=f9e406]:
                    - code [ref=f9e407]: set
                    - text: functions, like
                    - code [ref=f9e408]: setSomething(nextState)
                    - link "Link for this heading":
                      - /url: "#setstate"
                  - paragraph [ref=f9e409]:
                    - text: The
                    - code [ref=f9e410]: set
                    - text: function returned by
                    - code [ref=f9e411]: useState
                    - text: "lets you update the state to a different value and trigger a re-render. You can pass the next state directly, or a function that calculates it from the previous state:"
                  - code [ref=f9e417]:
                    - generic [ref=f9e418]: const [name, setName] = useState('Edward');
                    - generic [ref=f9e420]: "function handleClick() {"
                    - generic [ref=f9e421]: setName('Taylor');
                    - generic [ref=f9e422]: setAge(a => a + 1);
                    - generic [ref=f9e423]: // ...
                  - heading "Parameters Link for Parameters" [level=4] [ref=f9e424]:
                    - text: Parameters
                    - link "Link for Parameters":
                      - /url: "#setstate-parameters"
                  - list [ref=f9e425]:
                    - listitem [ref=f9e426]:
                      - code [ref=f9e427]: nextState
                      - text: ": The value that you want the state to be. It can be a value of any type, but there is a special behavior for functions."
                      - list [ref=f9e428]:
                        - listitem [ref=f9e429]:
                          - text: If you pass a function as
                          - code [ref=f9e430]: nextState
                          - text: ", it will be treated as an"
                          - emphasis [ref=f9e431]: updater function
                          - text: . It must be pure, should take the pending state as its only argument, and should return the next state. React will put your updater function in a queue and re-render your component. During the next render, React will calculate the next state by applying all of the queued updaters to the previous state.
                          - link "See an example below." [ref=f9e432] [cursor=pointer]:
                            - /url: "#updating-state-based-on-the-previous-state"
                  - heading "Returns Link for Returns" [level=4] [ref=f9e433]:
                    - text: Returns
                    - link "Link for Returns":
                      - /url: "#setstate-returns"
                  - paragraph [ref=f9e434]:
                    - code [ref=f9e435]: set
                    - text: functions do not have a return value.
                  - heading "Caveats Link for Caveats" [level=4] [ref=f9e436]:
                    - text: Caveats
                    - link "Link for Caveats":
                      - /url: "#setstate-caveats"
                  - list [ref=f9e437]:
                    - listitem [ref=f9e438]:
                      - paragraph [ref=f9e439]:
                        - text: The
                        - code [ref=f9e440]: set
                        - text: function
                        - strong [ref=f9e441]:
                          - text: only updates the state variable for the
                          - emphasis [ref=f9e442]: next
                          - text: render
                        - text: . If you read the state variable after calling the
                        - code [ref=f9e443]: set
                        - text: function,
                        - link "you will still get the old value" [ref=f9e444] [cursor=pointer]:
                          - /url: "#ive-updated-the-state-but-logging-gives-me-the-old-value"
                        - text: that was on the screen before your call.
                    - listitem [ref=f9e445]:
                      - paragraph [ref=f9e446]:
                        - text: If the new value you provide is identical to the current
                        - code [ref=f9e447]: state
                        - text: ", as determined by an"
                        - link [ref=f9e448] [cursor=pointer]:
                          - /url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/is
                          - code [ref=f9e449]: Object.is
                        - text: comparison, React will
                        - strong [ref=f9e450]: skip re-rendering the component and its children.
                        - text: This is an optimization. Although in some cases React may still need to call your component before skipping the children, it shouldn’t affect your code.
                    - listitem [ref=f9e451]:
                      - paragraph [ref=f9e452]:
                        - text: React
                        - link "batches state updates." [ref=f9e453] [cursor=pointer]:
                          - /url: /learn/queueing-a-series-of-state-updates
                        - text: It updates the screen
                        - strong [ref=f9e454]: after all the event handlers have run
                        - text: and have called their
                        - code [ref=f9e455]: set
                        - text: functions. This prevents multiple re-renders during a single event. In the rare case that you need to force React to update the screen earlier, for example to access the DOM, you can use
                        - link [ref=f9e456] [cursor=pointer]:
                          - /url: /reference/react-dom/flushSync
                          - code [ref=f9e457]: flushSync
                          - text: .
                    - listitem [ref=f9e458]:
                      - paragraph [ref=f9e459]:
                        - text: The
                        - code [ref=f9e460]: set
                        - text: function has a stable identity, so you will often see it omitted from Effect dependencies, but including it will not cause the Effect to fire. If the linter lets you omit a dependency without errors, it is safe to do.
                        - link "Learn more about removing Effect dependencies." [ref=f9e461] [cursor=pointer]:
                          - /url: /learn/removing-effect-dependencies#move-dynamic-objects-and-functions-inside-your-effect
                    - listitem [ref=f9e462]:
                      - paragraph [ref=f9e463]:
                        - text: Calling the
                        - code [ref=f9e464]: set
                        - text: function
                        - emphasis [ref=f9e465]: during rendering
                        - text: is only allowed from within the currently rendering component. React will discard its output and immediately attempt to render it again with the new state. This pattern is rarely needed, but you can use it to
                        - strong [ref=f9e466]: store information from the previous renders
                        - text: .
                        - link "See an example below." [ref=f9e467] [cursor=pointer]:
                          - /url: "#storing-information-from-previous-renders"
                    - listitem [ref=f9e468]:
                      - paragraph [ref=f9e469]:
                        - text: In Strict Mode, React will
                        - strong [ref=f9e470]: call your updater function twice
                        - text: in order to
                        - link "help you find accidental impurities." [ref=f9e471] [cursor=pointer]:
                          - /url: "#my-initializer-or-updater-function-runs-twice"
                        - text: This is development-only behavior and does not affect production. If your updater function is pure (as it should be), this should not affect the behavior. The result from one of the calls will be ignored.
