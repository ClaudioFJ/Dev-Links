                  - list [ref=f9e380]:
                    - listitem [ref=f9e381]:
                      - code [ref=f9e382]: initialState
                      - text: ": The value you want the state to be initially. It can be a value of any type, but there is a special behavior for functions. This argument is ignored after the initial render."
                      - list [ref=f9e383]:
                        - listitem [ref=f9e384]:
                          - text: If you pass a function as
                          - code [ref=f9e385]: initialState
                          - text: ", it will be treated as an"
                          - emphasis [ref=f9e386]: initializer function
                          - text: . It should be pure, should take no arguments, and should return a value of any type. React will call your initializer function when initializing the component, and store its return value as the initial state.
                          - link "See an example below." [ref=f9e387] [cursor=pointer]:
                            - /url: "#avoiding-recreating-the-initial-state"
                  - heading "Returns Link for Returns" [level=4] [ref=f9e388]:
