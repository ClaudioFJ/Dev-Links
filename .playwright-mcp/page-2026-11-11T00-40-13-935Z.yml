                  - list [ref=f16e409]:
                    - listitem [ref=f16e410]:
                      - paragraph [ref=f16e411]:
                        - code [ref=f16e412]: useEffect
                        - text: is a Hook, so you can only call it
                        - strong [ref=f16e413]: at the top level of your component
                        - text: or your own Hooks. You can’t call it inside loops or conditions. If you need that, extract a new component and move the state into it.
                    - listitem [ref=f16e414]:
                      - paragraph [ref=f16e415]:
                        - text: If you’re
                        - strong [ref=f16e416]: not trying to synchronize with some external system,
                        - link "you probably don’t need an Effect." [ref=f16e417] [cursor=pointer]:
                          - /url: /learn/you-might-not-need-an-effect
                    - listitem [ref=f16e418]:
                      - paragraph [ref=f16e419]:
                        - text: When Strict Mode is on, React will
                        - strong [ref=f16e420]: run one extra development-only setup+cleanup cycle
                        - text: before the first real setup. This is a stress-test that ensures that your cleanup logic “mirrors” your setup logic and that it stops or undoes whatever the setup is doing. If this causes a problem,
                        - link "implement the cleanup function." [ref=f16e421] [cursor=pointer]:
                          - /url: /learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development
                    - listitem [ref=f16e422]:
                      - paragraph [ref=f16e423]:
                        - text: If some of your dependencies are objects or functions defined inside the component, there is a risk that they will
                        - strong [ref=f16e424]: cause the Effect to re-run more often than needed.
                        - text: To fix this, remove unnecessary
                        - link "object" [ref=f16e425] [cursor=pointer]:
                          - /url: "#removing-unnecessary-object-dependencies"
                        - text: and
                        - link "function" [ref=f16e426] [cursor=pointer]:
                          - /url: "#removing-unnecessary-function-dependencies"
                        - text: dependencies. You can also
                        - link "extract state updates" [ref=f16e427] [cursor=pointer]:
                          - /url: "#updating-state-based-on-previous-state-from-an-effect"
                        - text: and
                        - link "non-reactive logic" [ref=f16e428] [cursor=pointer]:
                          - /url: "#reading-the-latest-props-and-state-from-an-effect"
                        - text: outside of your Effect.
                    - listitem [ref=f16e429]:
                      - paragraph [ref=f16e430]:
                        - text: If your Effect wasn’t caused by an interaction (like a click), React will generally let the browser
                        - strong [ref=f16e431]: paint the updated screen first before running your Effect.
                        - text: If your Effect is doing something visual (for example, positioning a tooltip), and the delay is noticeable (for example, it flickers), replace
                        - code [ref=f16e432]: useEffect
                        - text: with
                        - link [ref=f16e433] [cursor=pointer]:
                          - /url: /reference/react/useLayoutEffect
                          - code [ref=f16e434]: useLayoutEffect
                          - text: .
                    - listitem [ref=f16e435]:
                      - paragraph [ref=f16e436]:
                        - text: If your Effect is caused by an interaction (like a click),
                        - strong [ref=f16e437]: React may run your Effect before the browser paints the updated screen
                        - text: . This ensures that the result of the Effect can be observed by the event system. Usually, this works as expected. However, if you must defer the work until after paint, such as an
                        - code [ref=f16e438]: alert()
                        - text: ", you can use"
                        - code [ref=f16e439]: setTimeout
                        - text: . See
                        - link "reactwg/react-18/128" [ref=f16e440] [cursor=pointer]:
                          - /url: https://github.com/reactwg/react-18/discussions/128
                        - text: for more information.
                    - listitem [ref=f16e441]:
                      - paragraph [ref=f16e442]:
                        - text: Even if your Effect was caused by an interaction (like a click),
                        - strong [ref=f16e443]: React may allow the browser to repaint the screen before processing the state updates inside your Effect.
                        - text: Usually, this works as expected. However, if you must block the browser from repainting the screen, you need to replace
                        - code [ref=f16e444]: useEffect
                        - text: with
                        - link [ref=f16e445] [cursor=pointer]:
                          - /url: /reference/react/useLayoutEffect
                          - code [ref=f16e446]: useLayoutEffect
                          - text: .
                    - listitem [ref=f16e447]:
                      - paragraph [ref=f16e448]:
                        - text: Effects
                        - strong [ref=f16e449]: only run on the client.
                        - text: They don’t run during server rendering.
