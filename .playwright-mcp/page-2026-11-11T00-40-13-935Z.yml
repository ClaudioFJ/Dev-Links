                  - paragraph [ref=f16e1563]:
                    - text: If your Effect must block the browser from
                    - link "painting the screen," [ref=f16e1564] [cursor=pointer]:
                      - /url: /learn/render-and-commit#epilogue-browser-paint
                    - text: replace
