                    - text: Parameters
                    - link "Link for Parameters":
                      - /url: "#parameters"
                  - list [ref=f16e388]:
                    - listitem [ref=f16e389]:
                      - paragraph [ref=f16e390]:
                        - code [ref=f16e391]: setup
                        - text: ": The function with your Effect’s logic. Your setup function may also optionally return a"
                        - emphasis [ref=f16e392]: cleanup
                        - text: function. When your
                        - link "component commits" [ref=f16e393] [cursor=pointer]:
                          - /url: /learn/render-and-commit#step-3-react-commits-changes-to-the-dom
                        - text: ", React will run your setup function. After every commit with changed dependencies, React will first run the cleanup function (if you provided it) with the old values, and then run your setup function with the new values. After your component is removed from the DOM, React will run your cleanup function."
                    - listitem [ref=f16e394]:
                      - paragraph [ref=f16e395]:
                        - strong [ref=f16e396]: optional
                        - code [ref=f16e397]: dependencies
                        - text: ": The list of all reactive values referenced inside of the"
                        - code [ref=f16e398]: setup
                        - text: code. Reactive values include props, state, and all the variables and functions declared directly inside your component body. If your linter is
                        - link "configured for React" [ref=f16e399] [cursor=pointer]:
                          - /url: /learn/editor-setup#linting
                        - text: ", it will verify that every reactive value is correctly specified as a dependency. The list of dependencies must have a constant number of items and be written inline like"
                        - code [ref=f16e400]: "[dep1, dep2, dep3]"
                        - text: . React will compare each dependency with its previous value using the
                        - link [ref=f16e401] [cursor=pointer]:
                          - /url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/is
                          - code [ref=f16e402]: Object.is
                        - text: comparison. If you omit this argument, your Effect will re-run after every commit of the component.
                        - link "See the difference between passing an array of dependencies, an empty array, and no dependencies at all." [ref=f16e403] [cursor=pointer]:
                          - /url: "#examples-dependencies"
                  - heading "Returns Link for Returns" [level=4] [ref=f16e404]:
