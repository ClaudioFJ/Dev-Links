                    - text: Hook, and move the code reading
                    - code [ref=f16e1397]: shoppingCart
                    - text: "inside of it:"
                  - code [ref=f16e1403]:
                    - generic [ref=f16e1404]: "function Page({ url, shoppingCart }) {"
                    - generic [ref=f16e1405]: "const onVisit = useEffectEvent(visitedUrl => {"
