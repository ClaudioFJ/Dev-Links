                  - paragraph [ref=f16e479]:
                    - text: You need to pass two arguments to
                    - code [ref=f16e480]: useEffect
                    - text: ":"
                  - list [ref=f16e481]:
                    - listitem [ref=f16e482]:
                      - text: A
                      - emphasis [ref=f16e483]: setup function
                      - text: with setup code that connects to that system.
                      - list [ref=f16e484]:
                        - listitem [ref=f16e485]:
                          - text: It should return a
                          - emphasis [ref=f16e486]: cleanup function
                          - text: with cleanup code that disconnects from that system.
                    - listitem [ref=f16e487]: A list of dependencies including every value from your component used inside of those functions.
                  - paragraph [ref=f16e488]:
                    - strong [ref=f16e489]: "React calls your setup and cleanup functions whenever it’s necessary, which may happen multiple times:"
                  - list [ref=f16e490]:
