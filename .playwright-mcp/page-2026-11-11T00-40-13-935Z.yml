                  - paragraph [ref=f16e1385]:
                    - strong [ref=f16e1386]:
                      - text: What if you want to log a new page visit after every
                      - code [ref=f16e1387]: url
                      - text: change, but
                      - emphasis [ref=f16e1388]: not
                      - text: if only the
