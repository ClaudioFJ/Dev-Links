                    - text: You can’t exclude
                    - code [ref=f16e1390]: shoppingCart
                    - text: from dependencies without breaking the
                    - link "reactivity rules." [ref=f16e1391] [cursor=pointer]:
                      - /url: "#specifying-reactive-dependencies"
                    - text: However, you can express that you
                    - emphasis [ref=f16e1392]: don’t want
                    - text: a piece of code to “react” to changes even though it is called from inside an Effect.
                    - link [ref=f16e1393] [cursor=pointer]:
                      - /url: /learn/separating-events-from-effects#declaring-an-effect-event
                      - text: Declare an
                      - emphasis [ref=f16e1394]: Effect Event
                    - text: with the
