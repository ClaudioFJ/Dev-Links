                  - paragraph [ref=f16e1414]:
                    - strong [ref=f16e1415]: Effect Events are not reactive and must always be omitted from dependencies of your Effect.
                    - text: This is what lets you put non-reactive code (where you can read the latest value of some props and state) inside of them. By reading
                    - code [ref=f16e1416]: shoppingCart
                    - text: inside of
                    - code [ref=f16e1417]: onVisit
                    - text: ", you ensure that"
                    - code [ref=f16e1418]: shoppingCart
                    - text: won’t re-run your Effect.
                  - paragraph [ref=f16e1419]:
                    - link "Read more about how Effect Events let you separate reactive and non-reactive code." [ref=f16e1420] [cursor=pointer]:
                      - /url: /learn/separating-events-from-effects#reading-latest-props-and-state-with-effect-events
                  - separator [ref=f16e1421]
                  - heading "Displaying different content on the server and the client Link for Displaying different content on the server and the client" [level=3] [ref=f16e1422]:
                    - text: Displaying different content on the server and the client
                    - link "Link for Displaying different content on the server and the client":
                      - /url: "#displaying-different-content-on-the-server-and-the-client"
                  - paragraph [ref=f16e1423]:
                    - text: If your app uses server rendering (either
                    - link "directly" [ref=f16e1424] [cursor=pointer]:
                      - /url: /reference/react-dom/server
                    - text: or via a
                    - link "framework" [ref=f16e1425] [cursor=pointer]:
                      - /url: /learn/creating-a-react-app#full-stack-frameworks
                    - text: ), your component will render in two different environments. On the server, it will render to produce the initial HTML. On the client, React will run the rendering code again so that it can attach your event handlers to that HTML. This is why, for
                    - link "hydration" [ref=f16e1426] [cursor=pointer]:
                      - /url: /reference/react-dom/client/hydrateRoot#hydrating-server-rendered-html
                    - text: to work, your initial render output must be identical on the client and the server.
                  - paragraph [ref=f16e1427]:
                    - text: In rare cases, you might need to display different content on the client. For example, if your app reads some data from
                    - link [ref=f16e1428] [cursor=pointer]:
                      - /url: https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage
                      - code [ref=f16e1429]: localStorage
                    - text: ", it can’t possibly do that on the server. Here is how you could implement this:"
                  - code [ref=f16e1435]:
                    - generic [ref=f16e1436]: "function MyComponent() {"
                    - generic [ref=f16e1437]: const [didMount, setDidMount] = useState(false);
                    - generic [ref=f16e1439]: "useEffect(() => {"
                    - generic [ref=f16e1440]: setDidMount(true);
                    - generic [ref=f16e1441]: "}, []);"
                    - generic [ref=f16e1443]: "if (didMount) {"
                    - generic [ref=f16e1444]: // ... return client-only JSX ...
                    - generic [ref=f16e1445]: "} else {"
                    - generic [ref=f16e1446]: // ... return initial JSX ...
                    - generic [ref=f16e1447]: "}"
                    - generic [ref=f16e1448]: "}"
                  - paragraph [ref=f16e1449]:
                    - text: While the app is loading, the user will see the initial render output. Then, when it’s loaded and hydrated, your Effect will run and set
                    - code [ref=f16e1450]: didMount
                    - text: to
                    - code [ref=f16e1451]: "true"
                    - text: ", triggering a re-render. This will switch to the client-only render output. Effects don’t run on the server, so this is why"
                    - code [ref=f16e1452]: didMount
                    - text: was
                    - code [ref=f16e1453]: "false"
                    - text: during the initial server render.
                  - paragraph [ref=f16e1454]: Use this pattern sparingly. Keep in mind that users with a slow connection will see the initial content for quite a bit of time—potentially, many seconds—so you don’t want to make jarring changes to your component’s appearance. In many cases, you can avoid the need for this by conditionally showing different things with CSS.
                  - separator [ref=f16e1455]
                  - heading "Troubleshooting Link for Troubleshooting" [level=2] [ref=f16e1456]:
                    - text: Troubleshooting
                    - link "Link for Troubleshooting":
                      - /url: "#troubleshooting"
                  - heading "My Effect runs twice when the component mounts Link for My Effect runs twice when the component mounts" [level=3] [ref=f16e1457]:
                    - text: My Effect runs twice when the component mounts
                    - link "Link for My Effect runs twice when the component mounts":
                      - /url: "#my-effect-runs-twice-when-the-component-mounts"
                  - paragraph [ref=f16e1458]: When Strict Mode is on, in development, React runs setup and cleanup one extra time before the actual setup.
                  - paragraph [ref=f16e1459]: This is a stress-test that verifies your Effect’s logic is implemented correctly. If this causes visible issues, your cleanup function is missing some logic. The cleanup function should stop or undo whatever the setup function was doing. The rule of thumb is that the user shouldn’t be able to distinguish between the setup being called once (as in production) and a setup → cleanup → setup sequence (as in development).
                  - paragraph [ref=f16e1460]:
                    - text: Read more about
                    - link "how this helps find bugs" [ref=f16e1461] [cursor=pointer]:
                      - /url: /learn/synchronizing-with-effects#step-3-add-cleanup-if-needed
                    - text: and
                    - link "how to fix your logic." [ref=f16e1462] [cursor=pointer]:
                      - /url: /learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development
                  - separator [ref=f16e1463]
                  - heading "My Effect runs after every re-render Link for My Effect runs after every re-render" [level=3] [ref=f16e1464]:
                    - text: My Effect runs after every re-render
                    - link "Link for My Effect runs after every re-render":
                      - /url: "#my-effect-runs-after-every-re-render"
                  - paragraph [ref=f16e1465]: "First, check that you haven’t forgotten to specify the dependency array:"
                  - code [ref=f16e1471]:
                    - generic [ref=f16e1472]: "useEffect(() => {"
                    - generic [ref=f16e1473]: // ...
                    - generic [ref=f16e1474]: "}); // 🚩 No dependency array: re-runs after every commit!"
                  - paragraph [ref=f16e1475]: If you’ve specified the dependency array but your Effect still re-runs in a loop, it’s because one of your dependencies is different on every re-render.
                  - paragraph [ref=f16e1476]: "You can debug this problem by manually logging your dependencies to the console:"
                  - code [ref=f16e1482]:
                    - generic [ref=f16e1483]: "useEffect(() => {"
                    - generic [ref=f16e1484]: // ..
                    - generic [ref=f16e1485]: "}, [serverUrl, roomId]);"
                    - generic [ref=f16e1487]: console.log([serverUrl, roomId]);
                  - paragraph [ref=f16e1488]:
                    - text: You can then right-click on the arrays from different re-renders in the console and select “Store as a global variable” for both of them. Assuming the first one got saved as
                    - code [ref=f16e1489]: temp1
                    - text: and the second one got saved as
                    - code [ref=f16e1490]: temp2
                    - text: ", you can then use the browser console to check whether each dependency in both arrays is the same:"
                  - code [ref=f16e1496]:
                    - generic [ref=f16e1497]: Object.is(temp1[0], temp2[0]); // Is the first dependency the same between the arrays?
                    - generic [ref=f16e1498]: Object.is(temp1[1], temp2[1]); // Is the second dependency the same between the arrays?
                    - generic [ref=f16e1499]: Object.is(temp1[2], temp2[2]); // ... and so on for every dependency ...
                  - paragraph [ref=f16e1500]: "When you find the dependency that is different on every re-render, you can usually fix it in one of these ways:"
                  - list [ref=f16e1501]:
                    - listitem [ref=f16e1502]:
                      - link "Updating state based on previous state from an Effect" [ref=f16e1503] [cursor=pointer]:
                        - /url: "#updating-state-based-on-previous-state-from-an-effect"
                    - listitem [ref=f16e1504]:
                      - link "Removing unnecessary object dependencies" [ref=f16e1505] [cursor=pointer]:
                        - /url: "#removing-unnecessary-object-dependencies"
                    - listitem [ref=f16e1506]:
                      - link "Removing unnecessary function dependencies" [ref=f16e1507] [cursor=pointer]:
                        - /url: "#removing-unnecessary-function-dependencies"
                    - listitem [ref=f16e1508]:
                      - link "Reading the latest props and state from an Effect" [ref=f16e1509] [cursor=pointer]:
                        - /url: "#reading-the-latest-props-and-state-from-an-effect"
                  - paragraph [ref=f16e1510]:
                    - text: As a last resort (if these methods didn’t help), wrap its creation with
                    - link [ref=f16e1511] [cursor=pointer]:
                      - /url: /reference/react/useMemo#memoizing-a-dependency-of-another-hook
                      - code [ref=f16e1512]: useMemo
                    - text: or
                    - link [ref=f16e1513] [cursor=pointer]:
                      - /url: /reference/react/useCallback#preventing-an-effect-from-firing-too-often
                      - code [ref=f16e1514]: useCallback
                    - text: (for functions).
                  - separator [ref=f16e1515]
                  - heading "My Effect keeps re-running in an infinite cycle Link for My Effect keeps re-running in an infinite cycle" [level=3] [ref=f16e1516]:
                    - text: My Effect keeps re-running in an infinite cycle
                    - link "Link for My Effect keeps re-running in an infinite cycle":
                      - /url: "#my-effect-keeps-re-running-in-an-infinite-cycle"
                  - paragraph [ref=f16e1517]: "If your Effect runs in an infinite cycle, these two things must be true:"
                  - list [ref=f16e1518]:
                    - listitem [ref=f16e1519]: Your Effect is updating some state.
                    - listitem [ref=f16e1520]: That state leads to a re-render, which causes the Effect’s dependencies to change.
                  - paragraph [ref=f16e1521]: Before you start fixing the problem, ask yourself whether your Effect is connecting to some external system (like DOM, network, a third-party widget, and so on). Why does your Effect need to set state? Does it synchronize with that external system? Or are you trying to manage your application’s data flow with it?
                  - paragraph [ref=f16e1522]:
                    - text: If there is no external system, consider whether
                    - link "removing the Effect altogether" [ref=f16e1523] [cursor=pointer]:
                      - /url: /learn/you-might-not-need-an-effect
                    - text: would simplify your logic.
                  - paragraph [ref=f16e1524]:
                    - text: If you’re genuinely synchronizing with some external system, think about why and under what conditions your Effect should update the state. Has something changed that affects your component’s visual output? If you need to keep track of some data that isn’t used by rendering, a
                    - link "ref" [ref=f16e1525] [cursor=pointer]:
                      - /url: /reference/react/useRef#referencing-a-value-with-a-ref
                    - text: (which doesn’t trigger re-renders) might be more appropriate. Verify your Effect doesn’t update the state (and trigger re-renders) more than needed.
                  - paragraph [ref=f16e1526]:
                    - text: Finally, if your Effect is updating the state at the right time, but there is still a loop, it’s because that state update leads to one of the Effect’s dependencies changing.
                    - link "Read how to debug dependency changes." [ref=f16e1527] [cursor=pointer]:
                      - /url: /reference/react/useEffect#my-effect-runs-after-every-re-render
                  - separator [ref=f16e1528]
                  - heading "My cleanup logic runs even though my component didn’t unmount Link for My cleanup logic runs even though my component didn’t unmount" [level=3] [ref=f16e1529]:
                    - text: My cleanup logic runs even though my component didn’t unmount
                    - link "Link for My cleanup logic runs even though my component didn’t unmount":
                      - /url: "#my-cleanup-logic-runs-even-though-my-component-didnt-unmount"
                  - paragraph [ref=f16e1530]:
                    - text: The cleanup function runs not only during unmount, but before every re-render with changed dependencies. Additionally, in development, React
                    - link "runs setup+cleanup one extra time immediately after component mounts." [ref=f16e1531] [cursor=pointer]:
                      - /url: "#my-effect-runs-twice-when-the-component-mounts"
                  - paragraph [ref=f16e1532]: "If you have cleanup code without corresponding setup code, it’s usually a code smell:"
                  - code [ref=f16e1538]:
                    - generic [ref=f16e1539]: "useEffect(() => {"
                    - generic [ref=f16e1540]: "// 🔴 Avoid: Cleanup logic without corresponding setup logic"
                    - generic [ref=f16e1541]: "return () => {"
                    - generic [ref=f16e1542]: doSomething();
                    - generic [ref=f16e1543]: "};"
                    - generic [ref=f16e1544]: "}, []);"
                  - paragraph [ref=f16e1545]: "Your cleanup logic should be “symmetrical” to the setup logic, and should stop or undo whatever setup did:"
